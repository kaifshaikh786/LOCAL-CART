<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Checkout | LocalCart</title>

    <link rel="icon" type="image/png" href="../logo.png">
    <link
        rel="stylesheet"
        href="../style.css">

</head>


<body>


<header>

    <div class="logo">
        <img src="../logo.png" alt="LocalCart Logo" class="logo-img">
        <div class="logo-text">
            <h1>LocalCart</h1>
            <p>Shop Local. Save More.</p>
        </div>
    </div>


    <nav>

        <a href="../index.html">
            Home
        </a>

        <a href="product.html">
            Products
        </a>

    </nav>

</header>


<section>

    <h2>Checkout</h2>

    <div class="checkout-container">

        <!-- CART SUMMARY -->
        <div class="checkout-section">
            <h3>Order Summary</h3>
            <div id="cartSummary" class="cart-items-summary">
                <!-- Cart items will be loaded here -->
            </div>
            <hr>
            <p><strong>Total: ₹<span id="totalAmount">0</span></strong></p>
        </div>

        <!-- CHECKOUT FORM -->
        <div class="checkout-section">
            <h3>Delivery Details</h3>
            <form id="checkoutForm">

                <div class="form-group">
                    <label for="customerName">Full Name *</label>
                    <input 
                        type="text" 
                        id="customerName" 
                        placeholder="John Doe" 
                        required>
                </div>

                <div class="form-group">
                    <label for="customerEmail">Email *</label>
                    <input 
                        type="email" 
                        id="customerEmail" 
                        placeholder="john@example.com" 
                        required>
                </div>

                <div class="form-group">
                    <label for="customerPhone">Phone Number *</label>
                    <input 
                        type="tel" 
                        id="customerPhone" 
                        placeholder="+91 9876543210" 
                        required>
                </div>

                <div class="form-group">
                    <label for="customerAddress">Delivery Address *</label>
                    <textarea 
                        id="customerAddress" 
                        placeholder="123 Main Street, City, State 12345" 
                        required></textarea>
                </div>

                <div class="form-group">
                    <label for="deliveryType">Delivery Method *</label>
                    <select id="deliveryType" required>
                        <option value="">-- Select --</option>
                        <option value="pickup">Pickup from Store</option>
                        <option value="delivery">Home Delivery</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="specialNotes">Special Instructions (Optional)</label>
                    <textarea 
                        id="specialNotes" 
                        placeholder="Any special requests..."></textarea>
                </div>

                <button type="submit" class="checkout-btn">
                    ✓ Place Order
                </button>

            </form>
        </div>

    </div>




</section>


<footer>

    <p>
        © 2026 LocalCart. All Rights Reserved.
    </p>

</footer>


<script>

    // Load cart and display summary on page load
    document.addEventListener('DOMContentLoaded', function() {
        displayCartSummary();
        attachFormListener();
    });

    // Display cart items and total
    function displayCartSummary() {
        const cartItems = JSON.parse(localStorage.getItem('cart')) || [];
        const cartSummary = document.getElementById('cartSummary');
        let total = 0;

        if (cartItems.length === 0) {
            cartSummary.innerHTML = '<p>Your cart is empty</p>';
            return;
        }

        cartSummary.innerHTML = cartItems.map(item => {
            const itemTotal = item.price * (item.quantity || 1);
            total += itemTotal;
            return `
                <div class="cart-item-row">
                    <span>${item.name}</span>
                    <span>Qty: ${item.quantity || 1}</span>
                    <span>₹${itemTotal}</span>
                </div>
            `;
        }).join('');

        document.getElementById('totalAmount').textContent = total;
    }

    // Attach form submit listener
    function attachFormListener() {
        const form = document.getElementById('checkoutForm');
        form.addEventListener('submit', handleCheckout);
    }

    // Handle checkout submission
    function handleCheckout(e) {
        e.preventDefault();

        // Get form data
        const customerData = {
            name: document.getElementById('customerName').value,
            email: document.getElementById('customerEmail').value,
            phone: document.getElementById('customerPhone').value,
            address: document.getElementById('customerAddress').value,
            deliveryType: document.getElementById('deliveryType').value,
            specialNotes: document.getElementById('specialNotes').value
        };

        // Get cart items
        const cartItems = JSON.parse(localStorage.getItem('cart')) || [];
        const total = document.getElementById('totalAmount').textContent;

        // Generate order number
        const orderNumber = 'LC' + Date.now();

        // Create order object
        const orderData = {
            orderNumber: orderNumber,
            customer: customerData,
            items: cartItems,
            total: total,
            timestamp: new Date().toISOString()
        };

        const vendorOrders = JSON.parse(localStorage.getItem('localcart-vendor-orders')) || [];
        vendorOrders.unshift({
            id: orderNumber,
            customer: customerData.name,
            customerDetails: customerData,
            items: cartItems,
            total: Number(total),
            status: 'pending',
            date: new Date().toLocaleString('en-IN')
        });
        localStorage.setItem('localcart-vendor-orders', JSON.stringify(vendorOrders));

        // Save order to localStorage
        localStorage.setItem('lastOrder', JSON.stringify(orderData));

        // Send to backend (for WhatsApp notification)
        sendOrderToVendor(orderData);

        // Clear cart
        localStorage.removeItem('cart');

        // Redirect to confirmation
        window.location.href = 'order-confirmation.html?orderNumber=' + orderNumber;
    }

    // Send order to vendor via backend API
    function sendOrderToVendor(orderData) {
        // This will send to backend which will handle WhatsApp messaging
        fetch('/api/send-order', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(orderData)
        }).catch(err => {
            console.log('Order data prepared:', orderData);
            // Silently fail - order will still be placed
        });
    }

</script>


</body>

</html>
