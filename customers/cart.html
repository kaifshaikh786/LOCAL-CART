<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>My Cart | LocalCart</title>

    <link rel="icon" type="image/png" href="../logo.png">
    <link rel="stylesheet" href="../style.css">

</head>


<body>


<header>

    <div class="logo">
        <img src="../logo.png" alt="LocalCart Logo" class="logo-img">
        <div class="logo-text">
            <h1>LocalCart</h1>
            <p>Shop Local. Save More.</p>
        </div>
    </div>


    <nav>

        <a href="../index.html">
            Home
        </a>

        <a href="product.html">
            Products
        </a>

    </nav>

</header>


<section>

    <h2>🛒 My Shopping Cart</h2>


    <div class="cart-container">


        <!-- CART ITEMS -->

        <div class="cart-items">


            <div class="cart-item">

                <div class="product-image">
                    🎧
                </div>


                <div>

                    <h3>
                        Wireless Headphones
                    </h3>

                    <p>
                        ABC Electronics
                    </p>

                    <p>
                        ₹1,499
                    </p>


                    <label>
                        Quantity:
                    </label>

                    <input
                        type="number"
                        value="1"
                        min="1"
                    >

                </div>


                <button
                    onclick="removeItem(this)">

                    Remove

                </button>

            </div>


            <div class="cart-item">

                <div class="product-image">
                    👕
                </div>


                <div>

                    <h3>
                        Casual T-Shirt
                    </h3>

                    <p>
                        Local Fashion Store
                    </p>

                    <p>
                        ₹599
                    </p>


                    <label>
                        Quantity:
                    </label>

                    <input
                        type="number"
                        value="1"
                        min="1"
                    >

                </div>


                <button
                    onclick="removeItem(this)">

                    Remove

                </button>

            </div>


        </div>


        <!-- ORDER SUMMARY -->

        <div class="order-summary">

            <h3>
                Order Summary
            </h3>

            <hr>


            <p>
                Subtotal:
                <strong>₹2,098</strong>
            </p>


            <p>
                Delivery:
                <strong>₹50</strong>
            </p>


            <hr>


            <h2>
                Total: ₹2,148
            </h2>


            <button
                onclick="checkout()">

                Proceed to Checkout

            </button>

        </div>

    </div>

</section>


<footer>

    <p>
        © 2026 LocalCart. All Rights Reserved.
    </p>

</footer>


<script>

    // Load and display cart items
    document.addEventListener('DOMContentLoaded', function() {
        displayCartItems();
    });

    function displayCartItems() {
        const cart = JSON.parse(localStorage.getItem('cart')) || [];
        const cartItemsContainer = document.querySelector('.cart-items');
        let total = 0;

        if (cart.length === 0) {
            cartItemsContainer.innerHTML = '<p>Your cart is empty</p>';
            document.querySelector('.order-summary').style.display = 'none';
            return;
        }

        cartItemsContainer.innerHTML = cart.map((item, index) => {
            const itemTotal = item.price * (item.quantity || 1);
            total += itemTotal;
            return `
                <div class="cart-item">
                    <div class="product-image">📦</div>
                    <div>
                        <h3>${item.name}</h3>
                        <p>${item.vendor}</p>
                        <p>₹${item.price}</p>
                        <label>Quantity:</label>
                        <input type="number" value="${item.quantity || 1}" min="1" onchange="updateQuantity(${index}, this.value)">
                    </div>
                    <button onclick="removeItem(${index})">Remove</button>
                </div>
            `;
        }).join('');

        // Update total
        document.querySelector('.order-summary strong').innerHTML = '₹' + total;
    }

    function removeItem(index) {
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        cart.splice(index, 1);
        localStorage.setItem('cart', JSON.stringify(cart));
        displayCartItems();
    }

    function updateQuantity(index, newQty) {
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        cart[index].quantity = parseInt(newQty);
        localStorage.setItem('cart', JSON.stringify(cart));
        displayCartItems();
    }

    function checkout() {
        const cart = JSON.parse(localStorage.getItem('cart')) || [];
        if (cart.length === 0) {
            alert('Your cart is empty!');
            return;
        }
        window.location.href = "order.html";
    }

</script>


</body>

</html>
